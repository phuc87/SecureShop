<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Đơn hàng mới ' + ${order.orderCode}">Đơn hàng mới</title>
</head>
<body style="margin:0;padding:0;background:#f3f5f9;font-family:Arial,Helvetica,sans-serif;color:#0f1b2d;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f3f5f9;padding:24px 12px;">
    <tr><td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0"
               style="max-width:600px;width:100%;background:#ffffff;border:1px solid #dde3ec;border-radius:12px;overflow:hidden;">
            <tr th:replace="~{email/parts :: header}"></tr>
            <tr><td style="padding:24px;font-size:15px;line-height:1.6;">
                <h1 style="font-size:21px;margin:0 0 8px;">🛒 Có đơn hàng mới cần xác nhận</h1>
                <p style="margin:0;">
                    Đơn <b style="color:#0b4fc4;" th:text="${order.orderCode}">SS000</b>
                    của <b th:text="${order.customerName ?: order.receiverName}">Khách</b>
                    (<span th:text="${order.receiverEmail}">email</span>)
                    đặt lúc <span th:text="${#temporals.format(order.createdAt, 'HH:mm, dd/MM/yyyy')}">00:00</span>.
                </p>

                <table th:replace="~{email/parts :: items}"></table>
                <table th:replace="~{email/parts :: shipping}"></table>

                <p style="margin:0 0 8px;color:#586977;font-size:14px;">
                    Hãy gọi cho khách theo số <b th:text="${order.receiverPhone}">SĐT</b> để xác nhận, rồi cập nhật trạng thái đơn trong trang quản trị.
                </p>
                <table th:replace="~{email/parts :: button('Xử lý đơn hàng')}"></table>
            </td></tr>
            <tr th:replace="~{email/parts :: footer}"></tr>
        </table>
    </td></tr>
</table>
</body>
</html>
