<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Email thử nghiệm</title>
</head>
<body style="margin:0;padding:0;background:#f3f5f9;font-family:Arial,Helvetica,sans-serif;color:#0f1b2d;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f3f5f9;padding:24px 12px;">
    <tr><td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0"
               style="max-width:600px;width:100%;background:#ffffff;border:1px solid #dde3ec;border-radius:12px;overflow:hidden;">
            <tr th:replace="~{email/parts :: header}"></tr>
            <tr><td style="padding:24px;font-size:15px;line-height:1.6;">
                <h1 style="font-size:21px;margin:0 0 8px;">✅ Cấu hình email hoạt động</h1>
                <p style="margin:0;">Nếu bạn đọc được email này, hệ thống đã gửi được email qua Gmail. Từ giờ khách đặt hàng
                    sẽ nhận email xác nhận, và shop nhận email báo đơn mới.</p>
                <p style="margin:12px 0 0;color:#586977;font-size:13px;">
                    Gửi lúc <span th:text="${#temporals.format(sentAt, 'HH:mm:ss dd/MM/yyyy')}">00:00</span>
                </p>
            </td></tr>
            <tr th:replace="~{email/parts :: footer}"></tr>
        </table>
    </td></tr>
</table>
</body>
</html>
